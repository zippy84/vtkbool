name: CMake

on:
  push:
    branches:
      - '*'

jobs:
  Build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        cxx: [g++, clang++]
        build_type: [Debug, Release]

    container:
      image: kitware/vtk-for-ci:v9.7.2

    steps:
    - uses: actions/checkout@v4

    - name: Install Deps
      run: |
        apt-get update
        apt-get -y --no-install-recommends install ninja-build cmake clang python3-pytest xvfb

    - name: Configure CMake
      run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
          -DCMAKE_PREFIX_PATH=/opt/vtk/install
      env:
        CXX: ${{matrix.cxx}}
        CXXFLAGS: ${{matrix.cxxflags}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}} --parallel

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -C ${{matrix.build_type}}

  Coverage:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: kitware/vtk-for-ci:v9.7.2
    steps:
    - uses: actions/checkout@v4

    - name: Install Deps
      run: |
        apt-get update
        apt-get -y --no-install-recommends install ninja-build cmake clang python3-pytest xvfb gcovr

    - name: Configure CMake
      run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
          -DCMAKE_PREFIX_PATH=/opt/vtk/install
          -DCMAKE_BUILD_TYPE=Profile
          -DVTKBOOL_COVERAGE=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: |
        ctest --output-on-failure
        gcovr -r .. . --exclude-throw-branches --xml -o coverage.xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{secrets.CODECOV_TOKEN}}

